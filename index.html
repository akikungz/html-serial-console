<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Serial Terminal</title>
  
  <!-- Offline System Fonts & CSS (Zero External CDN Dependencies) -->
  <style>
    :root {
      --bg-base: #0a0e17;
      --bg-surface: #111827;
      --bg-surface-hover: #1f293d;
      --bg-surface-active: #28354f;
      --border-color: #1e293b;
      --border-focus: #3b82f6;
      
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #64748b;
      
      --accent-primary: #3b82f6;
      --accent-primary-hover: #2563eb;
      --accent-success: #10b981;
      --accent-success-glow: rgba(16, 185, 129, 0.25);
      --accent-danger: #ef4444;
      --accent-danger-glow: rgba(239, 68, 68, 0.25);
      --accent-warning: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      
      /* Premium Offline Monospace & Sans System Font Stacks */
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, "Liberation Mono", Menlo, Monaco, "Courier New", monospace;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }
    ::-webkit-scrollbar-thumb {
      background: #273549;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #374b67;
    }

    /* Top Navigation Bar */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.35);
    }

    .connection-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    /* Form Controls & Buttons */
    select, input, button {
      font-family: inherit;
      font-size: 0.875rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: #172033;
      color: var(--text-main);
      padding: 0.45rem 0.75rem;
      outline: none;
      transition: all 0.15s ease;
    }

    select:focus, input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    button {
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      user-select: none;
    }

    button:hover:not(:disabled) {
      background: var(--bg-surface-hover);
      border-color: #334155;
    }

    button:active:not(:disabled) {
      background: var(--bg-surface-active);
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #ffffff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-primary-hover);
      border-color: var(--accent-primary-hover);
    }

    .btn-success {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: #042f1f;
      font-weight: 600;
      box-shadow: 0 0 10px var(--accent-success-glow);
    }
    .btn-success:hover:not(:disabled) {
      background: #059669;
      border-color: #059669;
    }

    .btn-danger {
      background: var(--accent-danger);
      border-color: var(--accent-danger);
      color: #ffffff;
      box-shadow: 0 0 10px var(--accent-danger-glow);
    }
    .btn-danger:hover:not(:disabled) {
      background: #dc2626;
      border-color: #dc2626;
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-muted);
    }
    .btn-ghost:hover:not(:disabled) {
      background: var(--bg-surface-hover);
      color: var(--text-main);
    }

    .btn-secondary {
      background: #1c273e;
      border-color: #2e3e5b;
      color: #cbd5e1;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #273756;
      color: #ffffff;
      border-color: #3b82f6;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #1e293b;
      color: var(--text-muted);
      border: 1px solid #334155;
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .status-badge.connected .status-dot {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Subheader / Signals & Quick Tools */
    .toolbar-sub {
      background: #0d131f;
      border-bottom: 1px solid var(--border-color);
      padding: 0.45rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .signals-group, .stats-group, .view-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .signal-btn {
      padding: 0.2rem 0.55rem;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      border-radius: var(--radius-sm);
      background: #172033;
      border: 1px solid #28354f;
      color: var(--text-muted);
    }

    .signal-btn.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--accent-primary);
      color: #93c5fd;
    }

    .stat-tag {
      font-family: var(--font-mono);
      color: var(--text-dim);
      font-size: 0.75rem;
    }
    .stat-tag span {
      color: var(--text-muted);
    }

    /* Main Workspace */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #06090e;
      overflow: hidden;
    }

    /* Tab switcher for Terminal / Hex Dump */
    .tab-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0d131f;
      border-bottom: 1px solid var(--border-color);
      padding: 0 1rem;
    }

    .tabs {
      display: flex;
      gap: 0.25rem;
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: var(--text-dim);
      padding: 0.55rem 0.85rem;
      font-weight: 500;
      font-size: 0.8rem;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: transparent;
    }

    .tab-btn.active {
      color: var(--accent-cyan);
      border-bottom-color: var(--accent-cyan);
    }

    .terminal-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .terminal-actions label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
      margin-right: 0.5rem;
      user-select: none;
    }

    .terminal-actions input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--accent-primary);
    }

    /* Terminal Container & Built-in Offline ANSI Emulator */
    .view-panel {
      flex: 1;
      position: relative;
      display: none;
      overflow: hidden;
    }

    .view-panel.active {
      display: flex;
      flex-direction: column;
    }

    #terminal-container {
      width: 100%;
      height: 100%;
      padding: 0.75rem 1rem;
      background: #06090e;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.45;
      color: #f8fafc;
      outline: none;
      user-select: text;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #terminal-container:focus-within {
      box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.25);
    }

    .term-content {
      display: inline;
    }

    .term-line {
      min-height: 1.45em;
      display: block;
    }

    .term-cursor {
      display: inline-block;
      width: 8px;
      height: 1.15em;
      background: #38bdf8;
      vertical-align: text-bottom;
      margin-left: 2px;
      border-radius: 1px;
      animation: term-blink 1s step-end infinite;
    }

    .term-cursor:not(.focused) {
      background: transparent;
      border: 1px solid #38bdf8;
      opacity: 0.4;
      animation: none;
    }

    @keyframes term-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Hex Dump View */
    #hex-container {
      width: 100%;
      height: 100%;
      padding: 0.75rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #a5b4fc;
      overflow-y: auto;
      white-space: pre;
      line-height: 1.5;
      background: #06090e;
    }

    .hex-row {
      display: flex;
      gap: 1.25rem;
      padding: 1px 0;
    }
    .hex-offset { color: #64748b; }
    .hex-bytes { color: #38bdf8; }
    .hex-ascii { color: #34d399; }

    /* Macros in Subheader */
    .macros-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .macro-chip {
      background: #172033;
      border: 1px solid #28354f;
      color: #93c5fd;
      padding: 0.15rem 0.55rem;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      user-select: none;
    }

    .macro-chip:hover {
      background: #24324f;
      border-color: #3b82f6;
      color: #ffffff;
    }

    .macro-chip .macro-del {
      color: #64748b;
      font-weight: bold;
      border-radius: 50%;
      padding: 0 2px;
    }
    .macro-chip .macro-del:hover {
      color: #ef4444;
    }

    /* Modal / Settings Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 95%;
      max-width: 540px;
      padding: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .modal-header h3 {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    /* Compatibility Banner */
    #compat-banner {
      display: none;
      background: #7f1d1d;
      color: #fecaca;
      padding: 0.75rem 1.25rem;
      font-size: 0.875rem;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <!-- Web Serial Browser Support Warning -->
  <div id="compat-banner">
    <span>⚠️ <strong>Web Serial API is not supported in this browser.</strong> Please open this page in Google Chrome, Microsoft Edge, or Opera (version 89+) on Desktop or Android.</span>
    <button class="btn-ghost" onclick="document.getElementById('compat-banner').style.display='none'">✕</button>
  </div>

  <!-- Top Navigation -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 8 3 3-3 3"/><path d="M14 15h3"/>
        </svg>
      </div>
      <span>Serial Console</span>
    </div>

    <div class="connection-controls">
      <div id="status-badge" class="status-badge">
        <div class="status-dot"></div>
        <span id="status-text">Disconnected</span>
      </div>

      <select id="baud-select" title="Baud Rate">
        <option value="9600">9600 baud</option>
        <option value="19200">19200 baud</option>
        <option value="38400">38400 baud</option>
        <option value="57600">57600 baud</option>
        <option value="115200" selected>115200 baud</option>
        <option value="230400">230400 baud</option>
        <option value="460800">460800 baud</option>
        <option value="921600">921600 baud</option>
        <option value="custom">Custom...</option>
      </select>

      <button id="btn-settings" class="btn-ghost" title="Advanced Serial Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>

      <button id="btn-connect" class="btn-success">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
        </svg>
        <span>Connect</span>
      </button>

      <button id="btn-disconnect" class="btn-danger" style="display: none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect width="14" height="14" x="5" y="5" rx="2"/>
        </svg>
        <span>Disconnect</span>
      </button>
    </div>
  </header>

  <!-- Subheader: Signals, Reset, Quick Macros & Stats -->
  <div class="toolbar-sub">
    <div class="signals-group">
      <span style="color: var(--text-dim); font-size: 0.75rem; font-weight: 600;">PINS:</span>
      <button id="btn-dtr" class="signal-btn" title="Toggle Data Terminal Ready">DTR: OFF</button>
      <button id="btn-rts" class="signal-btn" title="Toggle Request To Send">RTS: OFF</button>
      <button id="btn-reset-esp" class="signal-btn" title="Pulse RTS/DTR for ESP32/Arduino Reset">⚡ Reset Device</button>
      <button id="btn-break" class="signal-btn" title="Send Break Signal">Break</button>
    </div>

    <!-- Quick Macros Toolbar -->
    <div class="macros-group" id="macros-bar">
      <span style="color: var(--text-dim); font-size: 0.75rem; font-weight: 600;">QUICK:</span>
      <div id="macros-list" style="display: flex; gap: 0.35rem; align-items: center;"></div>
      <button id="btn-add-macro" class="macro-chip" style="border-style: dashed; color: var(--text-muted);" title="Add new quick macro">+ Macro</button>
    </div>

    <div class="stats-group">
      <span class="stat-tag">RX: <span id="rx-bytes">0 B</span></span>
      <span class="stat-tag">TX: <span id="tx-bytes">0 B</span></span>
    </div>
  </div>

  <!-- Main View (Terminal & Hex) -->
  <main>
    <div class="tab-bar">
      <div class="tabs">
        <button class="tab-btn active" data-view="terminal">Terminal</button>
        <button class="tab-btn" data-view="hex">Hex Inspector</button>
      </div>

      <div class="terminal-actions">
        <label title="Show timestamps on new lines">
          <input type="checkbox" id="chk-timestamp">
          <span>Timestamp</span>
        </label>
        <label title="Automatically scroll to latest output">
          <input type="checkbox" id="chk-autoscroll" checked>
          <span>Auto-Scroll</span>
        </label>
        <label title="Echo typed keys locally on screen">
          <input type="checkbox" id="chk-localecho">
          <span>Local Echo</span>
        </label>

        <button id="btn-clear" class="btn-ghost" title="Clear Console">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          Clear
        </button>
        <button id="btn-export" class="btn-ghost" title="Download Console Log">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          Export
        </button>
      </div>
    </div>

    <!-- View Panel: Terminal -->
    <div id="panel-terminal" class="view-panel active">
      <div id="terminal-container"></div>
    </div>

    <!-- View Panel: Hex View -->
    <div id="panel-hex" class="view-panel">
      <div id="hex-container"></div>
    </div>
  </main>

  <!-- Advanced Settings Modal -->
  <div id="modal-settings" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Serial Port Settings</h3>
        <button id="btn-close-modal" class="btn-ghost">✕</button>
      </div>

      <div class="modal-grid">
        <div class="form-group">
          <label for="cfg-baud">Baud Rate</label>
          <input type="number" id="cfg-baud" value="115200" min="1" max="4000000">
        </div>
        <div class="form-group">
          <label for="cfg-databits">Data Bits</label>
          <select id="cfg-databits">
            <option value="8" selected>8 bits</option>
            <option value="7">7 bits</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cfg-stopbits">Stop Bits</label>
          <select id="cfg-stopbits">
            <option value="1" selected>1 stop bit</option>
            <option value="2">2 stop bits</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cfg-parity">Parity</label>
          <select id="cfg-parity">
            <option value="none" selected>None</option>
            <option value="even">Even</option>
            <option value="odd">Odd</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cfg-flow">Flow Control</label>
          <select id="cfg-flow">
            <option value="none" selected>None</option>
            <option value="hardware">Hardware (RTS/CTS)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cfg-buffer">Buffer Size</label>
          <input type="number" id="cfg-buffer" value="16384" step="1024" min="255">
        </div>

        <div class="form-group full-width">
          <label for="cfg-newline-mode">Enter Key Transmits (Newline Mode)</label>
          <select id="cfg-newline-mode">
            <option value="cr" selected>CR (\r) - Standard Serial / CLI default</option>
            <option value="crlf">CRLF (\r\n) - Windows / Telnet default</option>
            <option value="lf">LF (\n) - Unix / Linux default</option>
          </select>
        </div>

        <div class="form-group full-width">

      /* =========================================================================

        /**

            90: "#64748b", 91: "#f87171", 92: "#34d399", 93: "#fbbf24",
            94: "#60a5fa", 95: "#e879f9", 96: "#22d3ee", 97: "#ffffff"
          };

          /** @type {Record<number, string>} 16-color ANSI background palette map */
          this.bgPalette = {
            40: "#020617", 41: "rgba(239, 68, 68, 0.25)", 42: "rgba(16, 185, 129, 0.25)",
            43: "rgba(245, 158, 11, 0.25)", 44: "rgba(59, 130, 246, 0.25)",
            45: "rgba(217, 70, 239, 0.25)", 46: "rgba(6, 182, 212, 0.25)", 47: "#334155",
            100: "#1e293b", 101: "rgba(248, 113, 113, 0.3)", 102: "rgba(52, 211, 153, 0.3)",
            103: "rgba(251, 191, 36, 0.3)", 104: "rgba(96, 165, 250, 0.3)",
            105: "rgba(232, 121, 249, 0.3)", 106: "rgba(34, 211, 238, 0.3)", 107: "#475569"
          };

            bg: null,
            bold: false,
            dim: false,
            italic: false,
            underline: false,
            inverse: false

        /**

         */
        open(container) {

          this.container.tabIndex = 0;

          this.contentEl.className = "term-content";
          this.container.appendChild(this.contentEl);

          this.cursorEl = document.createElement("span");
          this.cursorEl.className = "term-cursor";
          this.cursorEl.innerHTML = " ";
          this.container.appendChild(this.cursorEl);

          this._createNewLine();

          // Native keyboard, focus and paste event listeners

          this.container.addEventListener("paste", (e) => {
            e.preventDefault();

            if (text) {
              this._emit(text);
              if (chkLocalEcho.checked) {
                this.write(text);
              }
            }
          });

          this.container.addEventListener("focus", () => {
            this.isFocused = true;
            this.cursorEl?.classList.add("focused");
          });

          this.container.addEventListener("blur", () => {
            this.isFocused = false;
            this.cursorEl?.classList.remove("focused");
          });

        /**

          }
        }

        /**
         * Appends a new line element to the terminal buffer and trims excess scrollback.
         * @private
         * @returns {void}
         */
        _createNewLine() {
          if (!this.contentEl) return;
          const line = document.createElement("div");
          line.className = "term-line";
          this.contentEl.appendChild(line);
          this.currentLineEl = line;
          this.lines.push(line);

          if (this.lines.length > this.maxLines) {
            const removed = this.lines.shift();
            if (removed && removed.parentNode) {
              removed.parentNode.removeChild(removed);
            }
          }

        /**

         * @param {(data: string) => void} callback - Handler function invoked with typed characters.
         * @returns {void}
         */
        onData(callback) {

        }

        /**
         * Emits data to all registered onData subscribers.
         * @private
         * @param {string} data - Raw keystroke or escape sequence string.
         * @returns {void}
         */
        _emit(data) {
          this.dataCallbacks.forEach((cb) => cb(data));
        }

        /**
         * Translates keyboard events into serial byte strings / escape sequences.
         * @private
         * @param {KeyboardEvent} e - DOM KeyboardEvent.
         * @returns {void}
         */
        _handleKeyDown(e) {
          if (e.ctrlKey) {
            if (e.key === "c" || e.key === "C") {
              const sel = window.getSelection()?.toString();
              if (sel && sel.length > 0) return; // Allow native clipboard copy
              e.preventDefault();
              this._emit("\x03"); // ETX (Ctrl+C)
              return;
            } else if (e.key === "d" || e.key === "D") {
              e.preventDefault();
              this._emit("\x04"); // EOT (Ctrl+D)
              return;
            } else if (e.key === "z" || e.key === "Z") {
              e.preventDefault();
              this._emit("\x1a"); // SUB (Ctrl+Z)
              return;
            } else if (e.key === "l" || e.key === "L") {
              e.preventDefault();
              this.clear();
              return;
            }
          }

          if (e.key === "Tab") {
            e.preventDefault();
            this._emit("\t");
            if (chkLocalEcho.checked) this.write("\t");
          } else if (e.key === "Enter") {
            e.preventDefault();
            const nl = getNewlineSequence();
            this._emit(nl);
            if (chkLocalEcho.checked) this.write("\r\n");
          } else if (e.key === "Backspace") {
            e.preventDefault();
            const bs = getBackspaceSequence();
            this._emit(bs);
            if (chkLocalEcho.checked) this.write("\b \b");
          } else if (e.key === "Delete") {
            e.preventDefault();
            this._emit("\x1b[3~");
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            this._emit("\x1b[A");
          } else if (e.key === "ArrowDown") {
            e.preventDefault();
            this._emit("\x1b[B");
          } else if (e.key === "ArrowRight") {
            e.preventDefault();
            this._emit("\x1b[C");
          } else if (e.key === "ArrowLeft") {
            e.preventDefault();
            this._emit("\x1b[D");
          } else if (e.key === "Home") {
            e.preventDefault();
            this._emit("\x1b[H");
          } else if (e.key === "End") {
            e.preventDefault();
            this._emit("\x1b[F");
          } else if (e.key === "Escape") {
            e.preventDefault();
            this._emit("\x1b");
          } else if (e.key.length === 1 && !e.altKey && !e.metaKey) {
            e.preventDefault();
            this._emit(e.key);
            if (chkLocalEcho.checked) this.write(e.key);
          }

        /**
         * Writes text containing ANSI escape sequences to the terminal buffer.
         * @param {string} text - Raw string to format and render.
         * @returns {void}
         */
        write(text) {
          if (!text) return;
          this._parseAnsi(text);
          if (this.autoScroll && this.container) {
            this.container.scrollTop = this.container.scrollHeight;
          }
        }

        /**
         * Writes a line of text followed by a carriage return and newline.
         * @param {string} text - Line of text to output.
         * @returns {void}
         */
        writeln(text) {

        }

        /**
         * Clears all content from the terminal display buffer.
         * @returns {void}
         */
        clear() {
          if (this.contentEl) {
            this.contentEl.innerHTML = "";
          }
          this.lines = [];
          this._createNewLine();
        }

        /**
         * Scrolls the terminal viewport to the bottom.
         * @returns {void}
         */
        scrollToBottom() {
          if (this.container) {
            this.container.scrollTop = this.container.scrollHeight;
          }
        }

        /**
         * API compatibility stub for resize fitting.
         * @returns {void}
         */
        fit() {}

        /**
         * Parses and extracts ANSI escape sequences from incoming text.
         * @private
         * @param {string} input - Raw chunk of text.
         * @returns {void}
         */
        _parseAnsi(input) {
          const regex = /\x1b\[([0-9;]*)([a-zA-Z])/g;
          let lastIndex = 0;
          let match;

          while ((match = regex.exec(input)) !== null) {
            const plain = input.substring(lastIndex, match.index);
            if (plain) {
              this._appendText(plain);
            }

            const params = match[1] ? match[1].split(";").map(Number) : [0];
            const command = match[2];

            if (command === "m") {
              this._applySgr(params);
            } else if (command === "J") {
              if (params[0] === 2) this.clear();
            } else if (command === "K") {
              if (this.currentLineEl) {
                this.currentLineEl.innerHTML = "";
              }
            }

            lastIndex = regex.lastIndex;
          }

          const remaining = input.substring(lastIndex);
          if (remaining) {
            this._appendText(remaining);
          }
        }

        /**
         * Applies Select Graphic Rendition (SGR) escape parameter codes to the styling state.
         * @private
         * @param {number[]} params - Array of SGR numeric codes.
         * @returns {void}
         */
        _applySgr(params) {
          for (let i = 0; i < params.length; i++) {
            const code = params[i];
            if (code === 0) {
              this.currentStyles = { fg: null, bg: null, bold: false, dim: false, italic: false, underline: false, inverse: false };
            } else if (code === 1) {
              this.currentStyles.bold = true;
            } else if (code === 2) {
              this.currentStyles.dim = true;
            } else if (code === 3) {
              this.currentStyles.italic = true;
            } else if (code === 4) {
              this.currentStyles.underline = true;
            } else if (code === 7) {
              this.currentStyles.inverse = true;
            } else if (code === 22) {
              this.currentStyles.bold = false;
              this.currentStyles.dim = false;
            } else if (code === 23) {
              this.currentStyles.italic = false;
            } else if (code === 24) {
              this.currentStyles.underline = false;
            } else if (code === 27) {
              this.currentStyles.inverse = false;
            } else if ((code >= 30 && code <= 37) || (code >= 90 && code <= 97)) {
              this.currentStyles.fg = this.colorPalette[code] || null;
            } else if (code === 39) {
              this.currentStyles.fg = null;
            } else if ((code >= 40 && code <= 47) || (code >= 100 && code <= 107)) {
              this.currentStyles.bg = this.bgPalette[code] || null;
            } else if (code === 49) {
              this.currentStyles.bg = null;
            } else if (code === 38 && params[i + 1] === 5 && params[i + 2] !== undefined) {
              // 256-color foreground
              this.currentStyles.fg = this._color256(params[i + 2]);
              i += 2;
            } else if (code === 48 && params[i + 1] === 5 && params[i + 2] !== undefined) {
              // 256-color background
              this.currentStyles.bg = this._color256(params[i + 2]);
              i += 2;
            } else if (code === 38 && params[i + 1] === 2 && params[i + 4] !== undefined) {
              // 24-bit TrueColor RGB foreground
              this.currentStyles.fg = `rgb(${params[i + 2]}, ${params[i + 3]}, ${params[i + 4]})`;
              i += 4;
            } else if (code === 48 && params[i + 1] === 2 && params[i + 4] !== undefined) {
              // 24-bit TrueColor RGB background
              this.currentStyles.bg = `rgb(${params[i + 2]}, ${params[i + 3]}, ${params[i + 4]})`;
              i += 4;
            }
          }
        }

        /**
         * Resolves a 256-color ANSI index into an RGB or hex color string.
         * @private
         * @param {number} n - Color index (0-255).
         * @returns {string} Color string (hex or rgb).
         */
        _color256(n) {
          if (n < 8) return this.colorPalette[30 + n];
          if (n < 16) return this.colorPalette[90 + (n - 8)];
          if (n >= 232) {
            const v = (n - 232) * 10 + 8;
            return `rgb(${v}, ${v}, ${v})`;
          }
          const idx = n - 16;
          const r = Math.floor(idx / 36) * 51;
          const g = Math.floor((idx % 36) / 6) * 51;
          const b = (idx % 6) * 51;
          return `rgb(${r}, ${g}, ${b})`;
        }

        /**
         * Processes raw text, handling line breaks (\r, \n) and backspaces (\b).
         * @private
         * @param {string} text - Text segment without escape sequences.
         * @returns {void}
         */
        _appendText(text) {
          let buf = "";
          for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (char === "\r") {
              if (text[i + 1] === "\n") {
                this._flushSpan(buf);
                buf = "";
                this._createNewLine();
                i++;
              } else {
                this._flushSpan(buf);
                buf = "";
                if (this.currentLineEl) {
                  this.currentLineEl.innerHTML = "";
                }
              }
            } else if (char === "\n") {
              this._flushSpan(buf);
              buf = "";
              this._createNewLine();
            } else if (char === "\b") {
              this._flushSpan(buf);
              buf = "";
              if (this.currentLineEl && this.currentLineEl.lastChild) {
                const last = this.currentLineEl.lastChild;
                if (last.textContent && last.textContent.length > 1) {
                  last.textContent = last.textContent.slice(0, -1);
                } else {
                  this.currentLineEl.removeChild(last);
                }
              }
            } else {
              buf += char;
            }
          }
          this._flushSpan(buf);
        }

        /**
         * Creates and appends a styled span element to the active line.
         * @private
         * @param {string} text - Text segment to render.
         * @returns {void}
         */
        _flushSpan(text) {
          if (!text || !this.currentLineEl) return;

          const span = document.createElement("span");
          span.textContent = text;

          let fg = this.currentStyles.fg;
          let bg = this.currentStyles.bg;
          if (this.currentStyles.inverse) {
            const temp = fg || "#f8fafc";
            fg = bg || "#06090e";
            bg = temp;
          }

          if (fg) span.style.color = fg;
          if (bg) span.style.backgroundColor = bg;
          if (this.currentStyles.bold) span.style.fontWeight = "600";
          if (this.currentStyles.dim) span.style.opacity = "0.65";
          if (this.currentStyles.italic) span.style.fontStyle = "italic";
          if (this.currentStyles.underline) span.style.textDecoration = "underline";

          this.currentLineEl.appendChild(span);
        }
      }

      /* =========================================================================
       * Application Helper Functions
       * ========================================================================= */

      /** @type {BuiltinTerminal} Global terminal instance */
      let term;

      /**
       * Initializes the terminal emulator and binds native keyboard callbacks.
       * @returns {void}
       */
      function initTerminal() {
        const terminalContainer = /** @type {HTMLElement} */ (document.getElementById("terminal-container"));
        term = new BuiltinTerminal({ scrollback: 10000 });
        term.open(terminalContainer);

        term.writeln("\x1b[1;36m=== Web Serial Interactive Console ===\x1b[0m");
        term.writeln("\x1b[90mNative interactive terminal. Click anywhere inside to start typing directly to the device.\x1b[0m\r\n");

        // Transmit keystrokes directly to serial port
        term.onData((data) => {
          if (isConnected && !isClosing) {
            writeToSerial(data);
          }
        });

        setTimeout(() => term.focus(), 150);
      }

      initTerminal();

      /**
       * Converts a byte count into a human-readable string (B, KB, MB, GB).
       * @param {number} bytes - Number of bytes.
       * @returns {string} Formatted size string.
       */
      function formatBytes(bytes) {
        if (bytes === 0) return "0 B";
        const k = 1024;
        const sizes = ["B", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
      }

      /**
       * Updates the RX and TX byte statistics labels in the subheader.
       * @returns {void}
       */
      function updateStats() {
        rxBytesLabel.textContent = formatBytes(rxByteCount);
        txBytesLabel.textContent = formatBytes(txByteCount);
      }

      /** @type {boolean} State tracker for timestamp prefix insertion */
      let atLineStart = true;

      /**
       * Generates a formatted ANSI-colored timestamp string [HH:MM:SS.mmm].
       * @returns {string} Formatted timestamp string.
       */
      function getTimestamp() {
        const now = new Date();
        return `\x1b[90m[${now.toTimeString().split(" ")[0]}.${String(now.getMilliseconds()).padStart(3, "0")}]\x1b[0m `;
      }

      /**
       * Requests a serial port from the user and opens the connection.
       * @async
       * @returns {Promise<void>}
       */
      async function connectSerial() {
        if (!("serial" in navigator)) {
          alert("Web Serial API is not supported in this browser. Please use Chrome, Edge, or Opera.");
          return;
        }

        if (port || isConnected) {
          await disconnectSerial();
        }

        try {
          port = await navigator.serial.requestPort();
          
          const baudRate = parseInt(baudSelect.value === "custom" ? cfgBaud.value : baudSelect.value, 10);
          const dataBits = /** @type {7|8} */ (parseInt(cfgDataBits.value, 10));
          const stopBits = /** @type {1|2} */ (parseInt(cfgStopBits.value, 10));
          const parity = /** @type {'none'|'even'|'odd'} */ (cfgParity.value);
          const flowControl = /** @type {'none'|'hardware'} */ (cfgFlow.value);
          const bufferSize = parseInt(cfgBuffer.value, 10) || 16384;

          await port.open({
            baudRate,
            dataBits,
            stopBits,
            parity,
            flowControl,
            bufferSize
          });

          isConnected = true;
          isClosing = false;
          setConnectedUI(true);

          if (term) {
            term.writeln(`\r\n\x1b[1;32m● Connected at ${baudRate} baud (${dataBits}${parity[0].toUpperCase()}${stopBits})\x1b[0m\r\n`);
            term.focus();
          }

          startReading();
        } catch (/** @type {any} */ err) {
          console.error("Connection error:", err);
          if (err.name !== "NotFoundError") {
            alert(`Failed to open serial port: ${err.message}`);
          }
          isConnected = false;
          isClosing = false;
          port = null;
          setConnectedUI(false);
        }
      }

      /**
       * Disconnects cleanly from the serial port without causing stream-lock deadlocks.
       * @async
       * @returns {Promise<void>}
       */
      async function disconnectSerial() {
        if (!port && !isConnected && !isClosing) return;
        if (isClosing) return;

        isClosing = true;
        isConnected = false;

        setConnectedUI(false);

        // 1. Cancel the active reader
        if (reader) {
          try {
            await reader.cancel();
          } catch (err) {
            console.warn("Reader cancel:", err);
          }
        }

        // 2. Wait for read loop to finish and release stream lock
        if (readLoopPromise) {
          try {
            await Promise.race([
              readLoopPromise,
              new Promise((resolve) => setTimeout(resolve, 500))
            ]);
          } catch (err) {
            console.warn("Wait readLoopPromise error:", err);
          }
          readLoopPromise = null;
        }

        // 3. Fallback release lock if reader is still around
        if (reader) {
          try {
            reader.releaseLock();
          } catch (e) {}
          reader = null;
        }

        // 4. Close port with safety timeout for virtual COM port drivers (HHD / VSPD / com0com)
        if (port) {
          try {
            await Promise.race([
              port.close(),
              new Promise((resolve) => setTimeout(resolve, 800))
            ]);
          } catch (err) {
            console.warn("Port close error:", err);
          }
          port = null;
        }

        isClosing = false;
        if (term) {
          term.writeln(`\r\n\x1b[1;31m○ Disconnected\x1b[0m\r\n`);
        }
      }

      // Hardware port disconnect event (when virtual or physical device is disconnected at OS level)
      if ("serial" in navigator) {
        navigator.serial.addEventListener("disconnect", (event) => {
          if (event.target === port) {
            if (term) term.writeln("\r\n\x1b[33m⚠️ Device disconnected from system\x1b[0m\r\n");
            disconnectSerial();
          }
        });
      }

      /**
       * Updates the header connection status badge, buttons, and signal controls.
       * @param {boolean} connected - Connection status.
       * @returns {void}
       */
      function setConnectedUI(connected) {
        if (connected) {
          statusBadge.classList.add("connected");
          statusText.textContent = "Connected";
          btnConnect.style.display = "none";
          btnDisconnect.style.display = "inline-flex";
          btnDisconnect.disabled = false;
          baudSelect.disabled = true;
        } else {
          statusBadge.classList.remove("connected");
          statusText.textContent = "Disconnected";
          btnConnect.style.display = "inline-flex";
          btnConnect.disabled = false;
          btnDisconnect.style.display = "none";
          baudSelect.disabled = false;
          dtrState = false;
          rtsState = false;
          btnDtr.classList.remove("active");
          btnRts.classList.remove("active");
          btnDtr.textContent = "DTR: OFF";
          btnRts.textContent = "RTS: OFF";
        }
      }

      /**
       * Launches the non-blocking continuous read loop.
       * @returns {void}
       */
      function startReading() {
        readLoopPromise = (async () => {
          while (port && port.readable && isConnected && !isClosing) {
            try {
              reader = port.readable.getReader();
              while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                if (value) {
                  handleIncomingBytes(value);
                }
              }
            } catch (err) {
              console.warn("Read stream notice:", err);
              break;
            } finally {
              if (reader) {
                try {
                  reader.releaseLock();
                } catch (e) {}
                reader = null;
              }
            }
          }
        })();

        readLoopPromise.then(() => {
          if (isConnected && !isClosing) {
            disconnectSerial();
          }
        }).catch((err) => {
          console.warn("Read loop rejected:", err);
        });
      }

      /** @type {TextDecoder} Global stream text decoder */
      const textDecoder = new TextDecoder();

      /**
       * Handles incoming byte buffers from the serial port.
       * @param {Uint8Array} bytes - Raw received byte array.
       * @returns {void}
       */
      function handleIncomingBytes(bytes) {
        rxByteCount += bytes.length;
        updateStats();

        // Convert to string for terminal & log
        const text = textDecoder.decode(bytes, { stream: true });
        logBuffer += text;

        if (term) {
          if (chkTimestamp.checked) {
            let output = "";
            for (let i = 0; i < text.length; i++) {
              if (atLineStart) {
                output += getTimestamp();
                atLineStart = false;
              }
              output += text[i];
              if (text[i] === "\n") {
                atLineStart = true;
              }
            }
            term.write(output);
          } else {
            term.write(text);
          }

          if (chkAutoScroll.checked) {
            term.scrollToBottom();
          }
        }

        // Append to Hex view
        appendHexDump(bytes);
      }

      /** @type {number} Byte offset counter for Hex Inspector */
      let hexOffset = 0;

      /**
       * Formats and appends bytes to the Hex Inspector view.
       * @param {Uint8Array} bytes - Raw byte array to format.
       * @returns {void}
       */
      function appendHexDump(bytes) {
        if (!hexContainer) return;
        const chunkSize = 16;
        let html = "";

        for (let i = 0; i < bytes.length; i += chunkSize) {
          const slice = bytes.slice(i, i + chunkSize);
          const offsetStr = hexOffset.toString(16).padStart(6, "0").toUpperCase();
          hexOffset += slice.length;

          let hexStr = "";
          let asciiStr = "";

          for (let j = 0; j < chunkSize; j++) {
            if (j < slice.length) {
              hexStr += slice[j].toString(16).padStart(2, "0").toUpperCase() + " ";
              const c = slice[j];
              asciiStr += (c >= 32 && c <= 126) ? String.fromCharCode(c) : ".";
            } else {
              hexStr += "   ";
            }
          }

          html += `<div class="hex-row"><span class="hex-offset">${offsetStr}</span><span class="hex-bytes">${hexStr}</span><span class="hex-ascii">${escapeHtml(asciiStr)}</span></div>`;
        }

        hexContainer.insertAdjacentHTML("beforeend", html);
        if (chkAutoScroll.checked) {
          hexContainer.scrollTop = hexContainer.scrollHeight;
        }
      }

      /**
       * Escapes special HTML characters to prevent XSS.
       * @param {string} str - Raw string.
       * @returns {string} Escaped HTML string.
       */
      function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      /**
       * Writes data (string or Uint8Array) to the active serial port.
       * @async
       * @param {string|Uint8Array} data - Data to transmit.
       * @returns {Promise<void>}
       */
      async function writeToSerial(data) {
        if (!port || !port.writable || !isConnected || isClosing) {
          if (!isConnected) {
            if (term) term.writeln("\x1b[33m[Warning: Serial port not connected. Click [Connect] first]\x1b[0m");
          }
          return;
        }

        /** @type {WritableStreamDefaultWriter<Uint8Array>|null} */
        let writer = null;
        try {
          writer = port.writable.getWriter();
          /** @type {Uint8Array} */
          let bytes;

          if (typeof data === "string") {
            const encoder = new TextEncoder();
            bytes = encoder.encode(data);
          } else {
            bytes = data;
          }

          await writer.write(bytes);
          txByteCount += bytes.length;
          updateStats();
        } catch (err) {
          console.error("Write error:", err);
        } finally {
          if (writer) {
            try {
              writer.releaseLock();
            } catch (e) {}
          }
        }
      }

      /**
       * Renders the quick macro chip buttons in the sub-toolbar.
       * @returns {void}
       */
      function renderMacros() {
        macrosList.innerHTML = "";
        macros.forEach((m, idx) => {
          const chip = document.createElement("div");
          chip.className = "macro-chip";
          chip.innerHTML = `<span>${escapeHtml(m.label)}</span><span class="macro-del" title="Delete macro">×</span>`;
          
          chip.addEventListener("click", (e) => {
            const target = /** @type {HTMLElement} */ (e.target);
            if (target.classList.contains("macro-del")) {
              e.stopPropagation();
              macros.splice(idx, 1);
              localStorage.setItem("serial_macros", JSON.stringify(macros));
              renderMacros();
            } else {
              const nl = getNewlineSequence();
              const payload = (m.cmd === "?" ? "?" : m.cmd + nl);
              writeToSerial(payload);
              if (chkLocalEcho.checked && term) {
                term.writeln(`\x1b[36m[MACRO] > ${m.cmd}\x1b[0m`);
              }
              term.focus();
            }
          });

          macrosList.appendChild(chip);
        });
      }
      renderMacros();

      btnAddMacro.addEventListener("click", () => {
        const label = prompt("Enter Macro Name / Label (e.g. Status):");
        if (!label) return;
        const cmd = prompt(`Enter command for "${label}":`, label);
        if (cmd !== null) {
          macros.push({ label, cmd });
          localStorage.setItem("serial_macros", JSON.stringify(macros));
          renderMacros();
        }
      });

      /**
       * Toggles hardware signals (DTR / RTS) on the active serial port.
       * @async
       * @param {'dataTerminalReady'|'requestToSend'} signal - Pin signal identifier.
       * @param {boolean} currentState - Current state of the pin.
       * @returns {Promise<boolean>} New signal state.
       */
      async function toggleSignal(signal, currentState) {
        if (!port || !isConnected || isClosing) return currentState;
        try {
          const newState = !currentState;
          /** @type {SerialOutputSignals} */
          const signals = {};
          signals[signal] = newState;
          await port.setSignals(signals);
          return newState;
        } catch (err) {
          console.error(`Failed to set ${signal}:`, err);
          return currentState;
        }
      }

      btnDtr.addEventListener("click", async () => {
        dtrState = await toggleSignal("dataTerminalReady", dtrState);
        btnDtr.classList.toggle("active", dtrState);
        btnDtr.textContent = `DTR: ${dtrState ? "ON" : "OFF"}`;
        term.focus();
      });

      btnRts.addEventListener("click", async () => {
        rtsState = await toggleSignal("requestToSend", rtsState);
        btnRts.classList.toggle("active", rtsState);
        btnRts.textContent = `RTS: ${rtsState ? "ON" : "OFF"}`;
        term.focus();
      });

      // ESP32 / Arduino Hardware Reset (pulse DTR & RTS)
      btnResetEsp.addEventListener("click", async () => {
        if (!port || !isConnected || isClosing) return;
        try {
          await port.setSignals({ dataTerminalReady: false, requestToSend: true });
          await new Promise((r) => setTimeout(r, 100));
          await port.setSignals({ dataTerminalReady: true, requestToSend: false });
          await new Promise((r) => setTimeout(r, 50));
          await port.setSignals({ dataTerminalReady: false, requestToSend: false });
          if (term) term.writeln("\r\n\x1b[33m⚡ Reset pulse sent to device\x1b[0m\r\n");
          term.focus();
        } catch (err) {
          console.error("Reset failed:", err);
        }
      });

      // Break signal
      btnBreak.addEventListener("click", async () => {
        if (!port || !isConnected || isClosing) return;
        try {
          await port.setSignals({ break: true });
          await new Promise((r) => setTimeout(r, 250));
          await port.setSignals({ break: false });
          if (term) term.writeln("\r\n\x1b[33m⚡ Break signal sent\x1b[0m\r\n");
          term.focus();
        } catch (err) {
          console.error("Break signal failed:", err);
        }
      });

      // View Switcher (Terminal / Hex)
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
          document.querySelectorAll(".view-panel").forEach((p) => p.classList.remove("active"));
          btn.classList.add("active");
          const view = /** @type {HTMLElement} */ (btn).dataset.view;
          const panel = document.getElementById(`panel-${view}`);
          if (panel) panel.classList.add("active");
          if (view === "terminal" && term) {
            term.scrollToBottom();
            term.focus();
          }
        });
      });

      // Clear Screen
      btnClear.addEventListener("click", () => {
        if (term) term.clear();
        if (hexContainer) hexContainer.innerHTML = "";
        hexOffset = 0;
        logBuffer = "";
        term.focus();
      });

      // Export Log
      btnExport.addEventListener("click", () => {
        const blob = new Blob([logBuffer], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
        a.href = url;
        a.download = `serial_log_${timestamp}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        term.focus();
      });

      // Settings Modal
      btnSettings.addEventListener("click", () => {
        modalSettings.classList.add("active");
      });
      btnCloseModal.addEventListener("click", () => {
        modalSettings.classList.remove("active");
        term.focus();
      });
      modalSettings.addEventListener("click", (e) => {
        if (e.target === modalSettings) {
          modalSettings.classList.remove("active");
          term.focus();
        }
      });

      btnApplySettings.addEventListener("click", () => {
        const val = cfgBaud.value;
        if (![...baudSelect.options].some((o) => o.value === val)) {
          baudSelect.value = "custom";
        } else {
          baudSelect.value = val;
        }
        modalSettings.classList.remove("active");
        term.focus();
      });

      baudSelect.addEventListener("change", () => {
        if (baudSelect.value === "custom") {
          modalSettings.classList.add("active");
        } else {
          cfgBaud.value = baudSelect.value;
        }
      });

      btnConnect.addEventListener("click", connectSerial);
      btnDisconnect.addEventListener("click", disconnectSerial);

    })();
  </script>
</body>
</html>
